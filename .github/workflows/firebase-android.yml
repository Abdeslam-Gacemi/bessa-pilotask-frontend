name: Firebase App Distribution (Android)

# Every push to master builds a signed release APK and sends it to the
# "testers" group on Firebase App Distribution. Can also be run by hand from
# the Actions tab (optionally with release notes and another group).
on:
  push:
    branches: [master]
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch:
    inputs:
      groups:
        description: "Tester groups (comma separated)"
        default: "testers"
      notes:
        description: "Release notes (default: last commit message)"
        required: false

# A newer push replaces a build still in progress.
concurrency:
  group: firebase-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.14.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The phone talks to the production API (no relative /api inside an APK).
      # Set the VITE_API_URL repository variable to change it.
      - name: Write .env
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          api="${VITE_API_URL:-https://pilotask.bessapromotion.net/api}"
          echo "VITE_API_URL=$api" > .env
          echo "API: $api"

      - name: Build web app
        run: pnpm build

      - name: Capacitor sync
        run: pnpm exec cap sync android

      # Push notifications on Android (gitignored file, kept as a secret).
      - name: Restore google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::Add the GOOGLE_SERVICES_JSON secret (the whole content of android/app/google-services.json)."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          jq -e '.client[] | select(.client_info.android_client_info.package_name == "com.bessapilotask.app")' android/app/google-services.json >/dev/null \
            || { echo "::error::google-services.json has no Android app com.bessapilotask.app."; exit 1; }

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # A CRLF gradlew (checked out on Windows) cannot run on Linux.
      - name: Prepare Gradle
        run: |
          sed -i 's/\r$//' android/gradlew
          chmod +x android/gradlew

      - name: Decode and check keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64:ANDROID_KEYSTORE_BASE64 KEYSTORE_PASSWORD:KEYSTORE_PASSWORD KEY_ALIAS:KEY_ALIAS KEY_PASSWORD:KEY_PASSWORD; do
            var=${name%%:*}; secret=${name##*:}
            if [ -z "${!var}" ]; then
              echo "::error::The $secret secret is empty or missing in this repository."
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 --decode > android/app/keystore.jks
          if [ ! -s android/app/keystore.jks ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 did not decode to a file. Create it with: base64 -w0 pilotask.jks"
            exit 1
          fi
          if ! keytool -list -keystore android/app/keystore.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::Cannot open key \"$KEY_ALIAS\" with KEYSTORE_PASSWORD. Aliases in the keystore:"
            keytool -list -keystore android/app/keystore.jks -storepass "$KEYSTORE_PASSWORD" 2>/dev/null | grep -i PrivateKeyEntry | cut -d, -f1 || true
            exit 1
          fi
          echo "Keystore OK, key alias: $KEY_ALIAS"

      # versionCode = run number, so each build installs over the previous one.
      - name: Build signed release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace
          apk=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          if [ -z "$apk" ]; then echo "::error::No APK in app/build/outputs/apk/release."; exit 1; fi
          case "$apk" in *unsigned*) echo "::error::The APK is unsigned: signing was not applied."; exit 1 ;; esac
          echo "APK_PATH=android/$apk" >> "$GITHUB_ENV"
          echo "Built $apk (version 1.0.${{ github.run_number }})"

      - name: Keep the APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: pilotask-${{ github.run_number }}.apk
          path: ${{ env.APK_PATH }}
          retention-days: 14

      - name: Release notes
        env:
          NOTES: ${{ github.event.inputs.notes }}
        run: |
          {
            echo "RELEASE_NOTES<<EOF"
            echo "Build ${{ github.run_number }}"
            if [ -n "$NOTES" ]; then echo "$NOTES"; else git log -1 --pretty=%B; fi
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        run: |
          [ -n "$FIREBASE_SERVICE_ACCOUNT" ] || { echo "::error::The FIREBASE_SERVICE_ACCOUNT secret is missing."; exit 1; }
          [ -n "$FIREBASE_APP_ID" ] || { echo "::error::The FIREBASE_APP_ID secret is missing (1:847459185254:android:…)."; exit 1; }
          # Accept the key as raw JSON or base64.
          if printf '%s' "$FIREBASE_SERVICE_ACCOUNT" | jq -e . >/dev/null 2>&1; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"
          elif printf '%s' "$FIREBASE_SERVICE_ACCOUNT" | base64 -d 2>/dev/null | jq -e . >/dev/null 2>&1; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" | base64 -d > "$RUNNER_TEMP/firebase-sa.json"
          else
            echo "::error::FIREBASE_SERVICE_ACCOUNT is not valid JSON (nor base64 JSON)."
            exit 1
          fi
          if [ "$(jq -r '.type // empty' "$RUNNER_TEMP/firebase-sa.json")" != "service_account" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT is not a service-account key."
            exit 1
          fi
          echo "Service account: $(jq -r .client_email "$RUNNER_TEMP/firebase-sa.json") (project $(jq -r .project_id "$RUNNER_TEMP/firebase-sa.json"))"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-sa.json" >> "$GITHUB_ENV"

      - name: Upload to Firebase App Distribution
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          GROUPS: ${{ github.event.inputs.groups || 'testers' }}
        run: |
          npm install -g firebase-tools --no-fund --no-audit --loglevel=error
          firebase appdistribution:distribute "$APK_PATH" \
            --app "$FIREBASE_APP_ID" \
            --groups "$GROUPS" \
            --release-notes "$RELEASE_NOTES"
